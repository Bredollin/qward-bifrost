# Gera o QwardBifrost-<versão>-portable.exe no Windows.
# - Todo push no main (e o botão "Run workflow"): o .exe fica em Actions > execução > Artifacts.
# - Tag v* (ex.: v0.1.0): cria uma Release com o .exe anexado.
name: exe-windows

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/core.test.mjs
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: QwardBifrost-windows
          path: dist/*.exe
          retention-days: 30
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
